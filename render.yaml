databases:
  - name: flux-db
    plan: free
    region: oregon

services:
  - type: web
    name: flux
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flux-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
