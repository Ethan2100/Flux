<script>
'use strict';

const __start = Date.now();
const __sleep = (ms) => new Promise((resolve, reject) => setTimeout(() => (__stopped ? reject(__STOP) : resolve()), ms));

function __print(v) { const d = document.createElement('div'); d.className = 'volt-line'; d.textContent = String(v); __add(d); }
function __html(v) { const d = document.createElement('div'); d.className = 'volt-html'; d.innerHTML = String(v); __add(d); }
let __showEl = null;
function __show(v) { if (!__showEl) { __showEl = document.createElement('div'); __showEl.className = 'volt-show'; __add(__showEl); } __showEl.textContent = String(v); }
function __clear() { __out.querySelectorAll('.volt-line, .volt-html, .volt-answer, .volt-error').forEach((el) => el.remove()); }
let __stopped = false;
const __STOP = { stop: true };
function __stop() { __stopped = true; throw __STOP; }
function __title(v) { document.title = String(v); const h = document.createElement('h1'); h.textContent = String(v); __add(h); }
function __error(e) { if (e === __STOP) return; console.error(e); const d = document.createElement('div'); d.className = 'volt-error'; d.textContent = 'Error: ' + (e && e.message ? e.message : e); __add(d); }
// Key presses: "k", "space", "up", "enter" ... ("any" means every key)
const __keys = [];
const __keyNames = { space: ' ', spacebar: ' ', up: 'arrowup', down: 'arrowdown', left: 'arrowleft', right: 'arrowright', esc: 'escape', return: 'enter' };
function __onKey(name, fn) { const k = String(name).toLowerCase(); __keys.push({ key: __keyNames[k] || k, fn }); }
document.addEventListener('keydown', (e) => {
  if (e.repeat || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const pressed = e.key.toLowerCase();
  const hits = __keys.filter((h) => h.key === pressed || h.key === 'any');
  if (hits.length && (pressed === ' ' || pressed.startsWith('arrow'))) e.preventDefault();
  if (__stopped) return;
  hits.forEach((h) => h.fn().catch(__error));
});
function __button(label, fn) { const b = document.createElement('button'); b.textContent = String(label); b.onclick = () => { if (!__stopped) fn().catch(__error); }; __add(b); }
function __ask(q) {
  return new Promise((resolve) => {
    const f = document.createElement('form'); f.className = 'volt-ask';
    const l = document.createElement('label'); l.textContent = String(q);
    const i = document.createElement('input'); i.autocomplete = 'off';
    const b = document.createElement('button'); b.textContent = 'OK';
    f.append(l, i, b);
    f.onsubmit = (e) => { e.preventDefault(); const d = document.createElement('div'); d.className = 'volt-line volt-answer'; d.textContent = String(q) + ' ' + i.value; f.replaceWith(d); resolve(i.value); };
    __add(f); i.focus();
  });
}
async function __main() {
  __title("Flux");
  __html("\u003cdiv class='bar'>\u003cdiv class='logo'>Flux\u003c/div>\u003cdiv class='who' id='whobox'>\u003c/div>\u003c/div>");
  __html("\u003cdiv id='app'>\u003c/div>");
  let me = null
  
  async function api(url, opts) {
  const res = await fetch(url, Object.assign({ headers: { 'content-type': 'application/json' } }, opts))
  let data = null
  try { data = await res.json() } catch (e) {}
  if (!res.ok) throw new Error((data && data.error) || 'Something went wrong')
  return data
  }
  
  function esc(s) {
  const d = document.createElement('div')
  d.textContent = s == null ? '' : s
  return d.innerHTML
  }
  
  function renderWho() {
  const box = document.getElementById('whobox')
  if (me) {
  box.innerHTML = '<span>' + esc(me.username) + '</span><button id=\"logoutBtn\">Log out</button>'
  document.getElementById('logoutBtn').onclick = async () => {
  await api('/api/logout', { method: 'POST' })
  me = null
  renderWho()
  renderApp()
  }
  } else {
  box.innerHTML = '<button id=\"loginBtn\">Log in / Sign up</button>'
  document.getElementById('loginBtn').onclick = () => renderAuth('login')
  }
  }
  
  function renderAuth(mode) {
  const app = document.getElementById('app')
  const isLogin = mode !== 'signup'
  app.innerHTML = `
  <div class='authbox'>
  <h3>${isLogin ? 'Log in' : 'Sign up'}</h3>
  <input id='authUser' type='text' placeholder='Username' autocomplete='username'>
  <input id='authPass' type='password' placeholder='Password' autocomplete='${isLogin ? 'current-password' : 'new-password'}'>
  <button id='authSubmit'>${isLogin ? 'Log in' : 'Sign up'}</button>
  <div class='error' id='authError'></div>
  <div class='switchline'>${isLogin ? "No account? <a id='switchLink'>Sign up</a>" : "Have an account? <a id='switchLink'>Log in</a>"}</div>
  </div>
  `
  document.getElementById('switchLink').onclick = () => renderAuth(isLogin ? 'signup' : 'login')
  document.getElementById('authSubmit').onclick = async () => {
  const username = document.getElementById('authUser').value.trim()
  const password = document.getElementById('authPass').value
  const errEl = document.getElementById('authError')
  errEl.textContent = ''
  try {
  me = await api(isLogin ? '/api/login' : '/api/signup', { method: 'POST', body: JSON.stringify({ username, password }) })
  renderWho()
  renderApp()
  } catch (e) {
  errEl.textContent = e.message
  }
  }
  }
  
  function renderComposer(container) {
  const box = document.createElement('div')
  box.className = 'composer'
  box.innerHTML = `
  <h3>New post</h3>
  <input id='composerFile' type='file' accept='image/*'>
  <input id='composerCaption' type='text' placeholder='Write a caption...'>
  <button class='primary' id='composerSubmit'>Share</button>
  <div class='error' id='composerError'></div>
  `
  container.appendChild(box)
  document.getElementById('composerSubmit').onclick = async () => {
  const fileInput = document.getElementById('composerFile')
  const errEl = document.getElementById('composerError')
  errEl.textContent = ''
  if (!fileInput.files[0]) { errEl.textContent = 'Pick an image first.'; return }
  const form = new FormData()
  form.append('image', fileInput.files[0])
  form.append('caption', document.getElementById('composerCaption').value)
  try {
  await fetch('/api/posts', { method: 'POST', body: form }).then(async (res) => {
  if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || 'Could not post.') }
  })
  await loadFeed()
  } catch (e) {
  errEl.textContent = e.message
  }
  }
  }
  
  function renderPost(p) {
  const el = document.createElement('div')
  el.className = 'post'
  const heart = p.liked_by_me ? '&#10084;' : '&#9825;'
  const likedClass = p.liked_by_me ? ' liked' : ''
  el.innerHTML = `
  <div class='phead'><div class='avatar'></div><div class='uname'>${esc(p.username)}</div></div>
  <img class='photo' src='/api/posts/${p.id}/image' loading='lazy'>
  <div class='actions'><button class='likebtn${likedClass}' id='like${p.id}'>${heart}</button></div>
  <div class='likes' id='likes${p.id}'>${p.likes} likes</div>
  <div class='caption'><b>${esc(p.username)}</b>${esc(p.caption)}</div>
  `
  el.querySelector('#like' + p.id).onclick = async () => {
  if (!me) { renderAuth('login'); return }
  const btn = el.querySelector('#like' + p.id)
  const result = await api('/api/posts/' + p.id + '/like', { method: 'POST' })
  btn.classList.toggle('liked', result.liked)
  btn.innerHTML = result.liked ? '&#10084;' : '&#9825;'
  el.querySelector('#likes' + p.id).textContent = result.likes + ' likes'
  }
  return el
  }
  
  async function loadFeed() {
  const app = document.getElementById('app')
  app.innerHTML = ''
  if (me) renderComposer(app)
  const posts = await api('/api/posts')
  if (!posts.length) {
  const empty = document.createElement('div')
  empty.className = 'empty'
  empty.textContent = 'No posts yet. Be the first to share something!'
  app.appendChild(empty)
  return
  }
  posts.forEach((p) => app.appendChild(renderPost(p)))
  }
  
  function renderApp() {
  loadFeed()
  }
  
  async function init() {
  me = await api('/api/me')
  renderWho()
  renderApp()
  }
  init()
}

__main().catch(__error);
</script>
